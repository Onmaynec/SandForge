schemaVersion: 1
metadata:
  name: installer-test
  displayName: Проверка установщика
  description: Снимки состояния до и после запуска установщика
sandbox:
  network: disabled
  clipboard: disabled
  protectedClient: true
  memoryMb: 4096
session:
  timeout: 30m
  keepWorkspace: false
target:
  executable: "C:\\Sandbox\\Input\\${targetFileName}"
  workingDirectory: "C:\\Sandbox\\Input"
  arguments:
artifacts:
  collectors:
    - process-list
    - installed-apps
    - file-changes
    - registry-changes
    - services
    - scheduled-tasks
    - user-output
