schemaVersion: 2
extends: "../common/base.yaml"
metadata:
  name: installer-test
  displayName: Проверка установщика
  description: Снимки состояния до и после запуска установщика
session:
  timeout: 30m
target:
  executable: "C:\\Sandbox\\Input\\${targetFileName}"
  workingDirectory: "C:\\Sandbox\\Input"
artifacts:
  collectors:
    - process-list
    - installed-apps
    - file-changes
    - registry-changes
    - services
    - scheduled-tasks
    - user-output
