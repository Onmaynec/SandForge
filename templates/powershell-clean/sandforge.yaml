schemaVersion: 2
extends: "../common/base.yaml"
metadata:
  name: powershell-clean
  displayName: Чистый PowerShell
  description: Запуск скопированного PowerShell-скрипта в offline Sandbox
target:
  executable: "powershell.exe"
  workingDirectory: "C:\\Sandbox\\Input"
  arguments:
    - "-NoLogo"
    - "-NoProfile"
    - "-NonInteractive"
    - "-ExecutionPolicy"
    - "Bypass"
    - "-File"
    - "C:\\Sandbox\\Input\\${targetFileName}"
