name: Verify SandForge 0.3.0-alpha Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.3.0-alpha.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify release metadata and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'SandForge-Release-Verifier'
          }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/Onmaynec/SandForge/releases/tags/v0.3.0-alpha'
          if (-not $release.prerelease) {
            throw 'Release is not marked as prerelease.'
          }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($expected in @(
            'SandForge-0.3.0-alpha-win-x64.zip',
            'SandForge-0.3.0-alpha-win-x64.zip.sha256')) {
            if ($expected -notin $names) {
              throw "Missing release asset: $expected"
            }
          }
          Write-Host "Verified release assets: $($names -join ', ')"

      - name: Remove one-time verifier
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-0.3.0-alpha.yml
          git commit -m "Remove one-time release verifier"
          git push origin HEAD:main
