name: Publish SandForge 0.3.0-alpha

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.3.0-alpha.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: 2c28ab63dc45b6ce5e49f1d076a0219d739f0ca5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Package win-x64
        shell: pwsh
        run: ./scripts/package.ps1 -Version 0.3.0-alpha

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-alpha
          target_commitish: 2c28ab63dc45b6ce5e49f1d076a0219d739f0ca5
          name: SandForge v0.3.0-alpha
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            artifacts/SandForge-0.3.0-alpha-win-x64.zip
            artifacts/SandForge-0.3.0-alpha-win-x64.zip.sha256
