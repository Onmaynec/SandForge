# Одноразовый merge-триггер публикации v0.5.0
name: Publish SandForge 0.5.0 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.5.0-final.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify stable version
        shell: pwsh
        run: |
          $project = Get-Content -LiteralPath Directory.Build.props -Raw
          if (-not $project.Contains('<Version>0.5.0</Version>')) {
            throw 'Stable version 0.5.0 is not set.'
          }

      - name: Test stable source
        run: dotnet test SandForge.sln -c Release

      - name: Package win-x64
        shell: pwsh
        run: ./scripts/package.ps1 -Version 0.5.0

      - name: Move stable tag to release commit
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -d v0.5.0 2>$null
          git tag -a v0.5.0 '${{ github.sha }}' -m 'SandForge v0.5.0'
          git push --force origin refs/tags/v0.5.0
          if ($LASTEXITCODE -ne 0) { throw 'Tag publication failed.' }

      - name: Write Russian release notes
        shell: pwsh
        run: |
          @(
            '## SandForge 0.5.0',
            '',
            '### Основные изменения',
            '- проверка совместимости через `sandforge schema`;',
            '- JSON Schema для основных форматов SandForge;',
            '- versioned JSON-отчёты;',
            '- package manifest с относительными путями, размером и SHA-256;',
            '- RU/EN интерфейс и contract tests;',
            '- блокировка неизвестных и неподдерживаемых версий схем.',
            '',
            '### Проверка архива',
            'Сравните SHA-256 скачанного ZIP с приложенным файлом `.sha256`.'
          ) | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          target_commitish: ${{ github.sha }}
          name: SandForge v0.5.0
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/SandForge-0.5.0-win-x64.zip
            artifacts/SandForge-0.5.0-win-x64.zip.sha256

      - name: Verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view v0.5.0 --repo Onmaynec/SandForge --json tagName,isDraft,isPrerelease,url,assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object name)
          if ($release.tagName -ne 'v0.5.0' -or $release.isDraft -or $release.isPrerelease) {
            throw 'Release metadata verification failed.'
          }
          if ($names -notcontains 'SandForge-0.5.0-win-x64.zip') { throw 'ZIP asset is missing.' }
          if ($names -notcontains 'SandForge-0.5.0-win-x64.zip.sha256') { throw 'SHA-256 asset is missing.' }
          Write-Host $release.url
