name: Publish SandForge 0.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.5.0.yml'

permissions:
  contents: write

concurrency:
  group: publish-sandforge-v0.5.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Promote source to stable 0.5.0
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $oldVersion = '0.5.0-alpha'
          $newVersion = '0.5.0'
          $extensions = @('.cs', '.props', '.ps1', '.md', '.json', '.yml', '.yaml')

          Get-ChildItem -Path . -File -Recurse |
            Where-Object {
              $extensions -contains $_.Extension.ToLowerInvariant() -and
              $_.FullName -notmatch '[\\/](bin|obj|artifacts|\.git)[\\/]'
            } |
            ForEach-Object {
              $content = Get-Content -LiteralPath $_.FullName -Raw
              if ($content.Contains($oldVersion)) {
                Set-Content -LiteralPath $_.FullName -Value $content.Replace($oldVersion, $newVersion) -Encoding utf8 -NoNewline
              }
            }

          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          if (-not $changelog.Contains('## [0.5.0]')) {
            $section = @'

## [0.5.0] - 2026-08-02

### Добавлено
- каталог публичных контрактов и версий схем;
- команды `sandforge schema list|describe|validate`;
- JSON Schema для templates, config, reports, completion marker и package manifest;
- versioned JSON-отчёты и portable package manifest с SHA-256;
- contract tests и compatibility policy.

### Изменено
- версия SandForge повышена до `0.5.0`;
- неподдерживаемые версии схем отклоняются до выполнения;
- template schema 1 и legacy report schema 0 поддерживаются с предупреждением.
'@
            $marker = '# Changelog'
            $rest = if ($changelog.StartsWith($marker)) { $changelog.Substring($marker.Length).TrimStart([char[]]"`r`n") } else { $changelog }
            Set-Content -LiteralPath CHANGELOG.md -Value ($marker + $section + "`r`n`r`n" + $rest) -Encoding utf8 -NoNewline
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Выпустить SandForge 0.5.0'
            git push origin HEAD:main
          }
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore SandForge.sln

      - name: Test release source
        run: dotnet test SandForge.sln -c Release --no-restore

      - name: Package win-x64
        shell: pwsh
        run: ./scripts/package.ps1 -Version 0.5.0

      - name: Write Russian release notes
        shell: pwsh
        run: |
          @'
          ## SandForge 0.5.0

          Релиз добавляет версионированные контракты и проверку совместимости файлов до их использования.

          ### Основные изменения
          - команда `sandforge schema list|describe|validate`;
          - JSON Schema Draft 2020-12 для основных форматов SandForge;
          - versioned JSON-отчёты;
          - package manifest с относительными путями, размером и SHA-256;
          - поддержка template schema 1 и report schema 0 с предупреждением;
          - блокировка неизвестных и неподдерживаемых схем;
          - RU/EN интерфейс и contract tests.

          ### Проверка архива
          Сравните SHA-256 скачанного ZIP с файлом `.sha256` из assets релиза.
          '@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Publish release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          target_commitish: ${{ steps.version.outputs.sha }}
          name: SandForge v0.5.0
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/SandForge-0.5.0-win-x64.zip
            artifacts/SandForge-0.5.0-win-x64.zip.sha256

      - name: Verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view v0.5.0 --repo Onmaynec/SandForge --json tagName,isDraft,isPrerelease,url,assets | ConvertFrom-Json
          if ($release.tagName -ne 'v0.5.0' -or $release.isDraft -or $release.isPrerelease) { throw 'Неверный статус релиза.' }
          $names = @($release.assets | ForEach-Object name)
          if ($names -notcontains 'SandForge-0.5.0-win-x64.zip') { throw 'В релизе отсутствует ZIP.' }
          if ($names -notcontains 'SandForge-0.5.0-win-x64.zip.sha256') { throw 'В релизе отсутствует SHA-256.' }
          Write-Host $release.url

      - name: Remove one-time publisher
        if: success()
        shell: pwsh
        run: |
          git rm .github/workflows/publish-0.5.0.yml
          git commit -m 'Удалить одноразовый publisher 0.5.0'
          git push origin HEAD:main
          git push origin --delete release/v0.5.0 2>$null
          exit 0
