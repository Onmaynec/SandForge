name: Validate and publish SandForge

on:
  pull_request:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/publish-sandforge

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reconstruct source tree
        shell: pwsh
        run: |
          $parts = Get-ChildItem .bootstrap/part-* | Sort-Object Name
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($base64))
          Expand-Archive source.zip -DestinationPath extracted -Force
          Copy-Item extracted/SandForge/* . -Recurse -Force
          Get-ChildItem extracted/SandForge -Force |
            Where-Object { $_.Name.StartsWith('.') } |
            ForEach-Object { Copy-Item $_.FullName . -Recurse -Force }
          Remove-Item source.zip -Force
          Remove-Item extracted, .bootstrap -Recurse -Force
          Remove-Item .github/workflows -Recurse -Force

      - name: Restore dependencies
        run: dotnet restore SandForge.sln

      - name: Build
        run: dotnet build SandForge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SandForge.sln --configuration Release --no-build

      - name: Commit validated project
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish SandForge 0.1.0-alpha"
          git push origin HEAD:agent/publish-sandforge
