name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build SandForge.sln -c Release --no-restore
      - run: dotnet publish src/SandForge.Cli/SandForge.Cli.csproj -c Release -r win-x64 --self-contained false -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SandForge-win-x64
          path: artifacts/win-x64
